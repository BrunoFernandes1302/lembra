[project]
name = "lembra"
version = "0.1.0"
description = "Lembra: app de organização da vida pessoal com IA (RAG)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "email-validator>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Embeddings locais (privados, mas exigem ~1 GB de RAM): pip install -e ".[local]"
local = ["sentence-transformers>=3.0"]
# Experimentos de fine-tuning (finetuning/README.md). Separado do app: a Vercel nunca instala o PyTorch.
finetuning = ["numpy>=1.26", "torch>=2.2", "transformers>=4.45", "peft>=0.13", "accelerate>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI declara dependências como valor padrão (Depends): é o padrão oficial, não um bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
